services:
  # Production service: no source bind-mounts, no reload, tests disabled.
  file-extraction-service:
    build:
      context: .
      args:
        ENABLED_TOOLS: ${ENABLED_TOOLS:-file_converter,url_fetcher,text_processor}
        ENABLE_TESTS: "false"
    ports:
      - "8000:8000"
    volumes:
      # Persistent working area for uploaded/processed files.
      - ./data:/app/data:rw
    environment:
      # Runtime settings are read with the FTMD_ prefix (see fastapi_mcp_template/config.py).
      FTMD_HOST: 0.0.0.0
      FTMD_PORT: "8000"
      FTMD_DEBUG: "false"
      FTMD_RELOAD: "false"
      FTMD_LOG_LEVEL: INFO
      # Runtime tool allow-list (empty = load every tool in the image).
      FTMD_ENABLED_TOOLS: ${ENABLED_TOOLS:-file_converter,url_fetcher,text_processor}
      # Security: set an API key to require X-API-Key on tool/admin endpoints.
      FTMD_API_KEY: ${FTMD_API_KEY:-}
      FTMD_CORS_ORIGINS: ${FTMD_CORS_ORIGINS:-*}
      # Optional LLM vision for scanned docs (traditional OCR works without this).
      # FTMD_OPENAI_API_KEY may stay empty for a self-hosted endpoint (FTMD_OPENAI_BASE_URL).
      FTMD_MARKITDOWN_ENABLE_LLM: ${FTMD_MARKITDOWN_ENABLE_LLM:-false}
      FTMD_OPENAI_API_KEY: ${FTMD_OPENAI_API_KEY:-}
      FTMD_OPENAI_MODEL: ${FTMD_OPENAI_MODEL:-gpt-4o}
      FTMD_OPENAI_BASE_URL: ${FTMD_OPENAI_BASE_URL:-}
      # Scanned pages: vision_first (LLM reads them, Tesseract is the fallback)
      # or ocr_first (Tesseract reads them, LLM only for pages it cannot read).
      FTMD_OCR_STRATEGY: ${FTMD_OCR_STRATEGY:-vision_first}
      FTMD_OCR_LANGUAGES: ${FTMD_OCR_LANGUAGES:-eng}
      FTMD_OCR_MAX_PAGES: ${FTMD_OCR_MAX_PAGES:-50}
      FTMD_VISION_MAX_TOKENS: ${FTMD_VISION_MAX_TOKENS:-4000}
      FTMD_VISION_MAX_CALLS_PER_REQUEST: ${FTMD_VISION_MAX_CALLS_PER_REQUEST:-0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development service: hot-reload of tools/tests/source, tests enabled, debug on.
  file-extraction-service-dev:
    build:
      context: .
      args:
        ENABLED_TOOLS: ${ENABLED_TOOLS:-file_converter,url_fetcher,text_processor}
        ENABLE_TESTS: "true"
    ports:
      - "8001:8000"
    volumes:
      - ./tools:/app/tools:ro
      - ./tests:/app/tests:ro
      - ./fastapi_mcp_template:/app/fastapi_mcp_template:ro
      - ./data:/app/data:rw
    environment:
      FTMD_HOST: 0.0.0.0
      FTMD_PORT: "8000"
      FTMD_DEBUG: "true"
      FTMD_RELOAD: "true"
      FTMD_LOG_LEVEL: DEBUG
      FTMD_ENABLED_TOOLS: ${ENABLED_TOOLS:-file_converter,url_fetcher,text_processor}
      FTMD_API_KEY: ${FTMD_API_KEY:-}
      FTMD_MARKITDOWN_ENABLE_LLM: ${FTMD_MARKITDOWN_ENABLE_LLM:-false}
      FTMD_OPENAI_API_KEY: ${FTMD_OPENAI_API_KEY:-}
      FTMD_OPENAI_MODEL: ${FTMD_OPENAI_MODEL:-gpt-4o}
      FTMD_OPENAI_BASE_URL: ${FTMD_OPENAI_BASE_URL:-}
      FTMD_OCR_STRATEGY: ${FTMD_OCR_STRATEGY:-vision_first}
      FTMD_OCR_LANGUAGES: ${FTMD_OCR_LANGUAGES:-eng}
      FTMD_OCR_MAX_PAGES: ${FTMD_OCR_MAX_PAGES:-50}
      FTMD_VISION_MAX_TOKENS: ${FTMD_VISION_MAX_TOKENS:-4000}
      FTMD_VISION_MAX_CALLS_PER_REQUEST: ${FTMD_VISION_MAX_CALLS_PER_REQUEST:-0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - dev

networks:
  default:
    name: file-extraction-service-network
